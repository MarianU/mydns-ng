{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "mydns-health-monitor.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "mydns-health-monitor.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "mydns-health-monitor.selectorLabels" . | nindent 6 }}
{{- end }}
