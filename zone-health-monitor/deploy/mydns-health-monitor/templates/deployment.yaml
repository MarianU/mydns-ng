apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mydns-health-monitor.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "mydns-health-monitor.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mydns-health-monitor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mydns-health-monitor.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mydns-health-monitor.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: PEER_SERVICE_FQDN
              value: "{{ include "mydns-health-monitor.fullname" . }}-peers.{{ .Release.Namespace }}.svc.cluster.local"
            - name: HTTP_PORT
              value: {{ .Values.http.port | quote }}
            - name: CHECK_INTERVAL
              value: {{ .Values.healthCheck.interval | quote }}
            - name: FAILURE_THRESHOLD
              value: {{ .Values.healthCheck.failureThreshold | quote }}
            - name: SUCCESS_THRESHOLD
              value: {{ .Values.healthCheck.successThreshold | quote }}
            - name: CHECK_TIMEOUT
              value: {{ .Values.healthCheck.timeout | quote }}
            - name: DISCOVERY_INTERVAL
              value: {{ .Values.discovery.interval | quote }}
            - name: PEER_TIMEOUT
              value: {{ .Values.peer.timeout | quote }}
            - name: DRY_RUN
              value: {{ .Values.dryRun | quote }}
            - name: DB_HOST
              value: {{ .Values.database.host | quote }}
            - name: DB_PORT
              value: {{ .Values.database.port | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "mydns-health-monitor.databaseSecretName" . }}
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mydns-health-monitor.databaseSecretName" . }}
                  key: password
            - name: DB_NAME
              value: {{ .Values.database.name | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.http.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
