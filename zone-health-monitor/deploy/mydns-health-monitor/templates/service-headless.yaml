apiVersion: v1
kind: Service
metadata:
  name: {{ include "mydns-health-monitor.fullname" . }}-peers
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "mydns-health-monitor.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: {{ .Values.http.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "mydns-health-monitor.selectorLabels" . | nindent 4 }}
