apiVersion: v1
kind: Service
metadata:
  name: {{ include "mydns-ng.fullname" . }}
  labels:
    {{- include "mydns-ng.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: server
      port: {{ .Values.service.dns.port }}
      targetPort: name-udp
      protocol: UDP
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort.udp }}
      nodePort: {{ .Values.service.nodePort.udp | int }}
      {{- end }}
    - name: server-tcp
      port: {{ .Values.service.dns.port }}
      targetPort: name-tcp
      protocol: TCP
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort.tcp }}
      nodePort: {{ .Values.service.nodePort.tcp | int }}
      {{- end }}
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
  selector:
    {{- include "mydns-ng.selectorLabels" . | nindent 4 }}
  {{- if .Values.service.sessionAffinity }}
  sessionAffinity: {{ .Values.service.sessionAffinity }}
  {{- end }}
