{{- if and .Values.dns01.enabled (not .Values.dns01.db.existingSecret) (not .Values.dns01.db.vault.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mydns-ng.webhookDbSecret" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "mydns-ng.labels" . | nindent 4 }}
type: Opaque
stringData:
  host: {{ .Values.dns01.db.host | quote }}
  port: {{ .Values.dns01.db.port | quote }}
  user: {{ .Values.dns01.db.user | quote }}
  password: {{ .Values.dns01.db.password | quote }}
  database: {{ .Values.dns01.db.database | quote }}
{{- end }}
