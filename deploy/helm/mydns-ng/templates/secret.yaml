{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mydns-ng.fullname" . }}-secret
  labels:
    {{- include "mydns-ng.labels" . | nindent 4 }}
type: Opaque
stringData:
  host: {{ .Values.database.host | quote }}
  user: {{ .Values.database.user | quote }}
  pass: {{ .Values.database.pass | quote }}
  database: {{ .Values.database.name | quote }}
  domainCheck: {{ .Values.database.domainCheck | quote }}
{{- end }}
