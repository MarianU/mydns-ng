# MyDNS-NG Helm Chart Values
# See README.md for full documentation

nameOverride: ""
fullnameOverride: ""

# Number of replicas
replicaCount: 3

image:
  repository: ghcr.io/marianu/mydns-ng
  tag: ""  # Defaults to appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Database configuration
database:
  # Use existing secret for database credentials
  # Secret should contain: host, user, password, database
  existingSecret: ""

  # Or specify credentials directly (not recommended for production)
  host: ""
  user: "mydns"
  password: ""
  name: "mydns"

  # Connection pooling
  pool:
    enabled: false
    size: 10
    min: 2
    acquireTimeout: 5
    validateInterval: 30

# DNS server configuration
dns:
  # EDNS0 support
  edns:
    enabled: true
    maxUdpSize: 4096

  # Cache settings
  cache:
    zoneSize: 1024
    zoneExpire: 60
    replySize: 1024
    replyExpire: 30
    staleTtl: 300

# Response Rate Limiting (DDoS protection)
rrl:
  enabled: true
  rate: 20
  window: 15
  slipRatio: 2
  ipv4Prefix: 24
  ipv6Prefix: 48

# Logging configuration
logging:
  format: json  # text or json
  level: notice  # debug, info, notice, warning, error
  queryLog: false

# Metrics and health endpoints
metrics:
  enabled: true
  port: 9153

  # Prometheus ServiceMonitor
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

# Graceful shutdown
shutdown:
  timeout: 30

# Service configuration
service:
  type: ClusterIP

  dns:
    port: 53

  # For NodePort or LoadBalancer
  nodePort:
    udp: ""
    tcp: ""

  annotations: {}

  # External traffic policy (Local recommended for source IP preservation)
  externalTrafficPolicy: Local

# Kubernetes probes
probes:
  liveness:
    enabled: true
    httpGet:
      path: /healthz
      port: metrics
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readiness:
    enabled: true
    httpGet:
      path: /readyz
      port: metrics
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Resource limits
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}

# Pod topology spread constraints
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: mydns-ng

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1

# Service account
serviceAccount:
  create: true
  name: ""
  annotations: {}

# Extra environment variables
extraEnv: []
# - name: MYDNS_EXTRA_VAR
#   value: "value"

# Extra volume mounts
extraVolumeMounts: []

# Extra volumes
extraVolumes: []

# Pod annotations
podAnnotations: {}

# Pod labels
podLabels: {}

# Dynamic DNS sync cronjob (optional)
ddnsSync:
  enabled: false
  schedule: "*/15 * * * *"
  regions: 3
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  hostNetwork: true

# DNS-01 ACME webhook (cert-manager solver) merged into this chart.
# When enabled, deploys the mydns-acme-webhook as a separate Deployment in
# the same release/namespace, using the same combined image (the webhook
# binary is baked into the mydns image).
dns01:
  enabled: false

  # API group the webhook serves (must match the webhook ClusterIssuer
  # solver groupName and be unique cluster-wide as an APIService)
  groupName: dns01.mydns-ng
  solverName: mydns

  # The webhook binary path inside the combined image
  binaryPath: /usr/local/bin/webhook

  # Register the K8s APIService (v1alpha1.<groupName>). Disable when you
  # register the APIService yourself (e.g. in an Argo meta chart).
  registerAPIService: true

  # cert-manager service account that must be granted domain-solver access
  certManager:
    namespace: ingress
    serviceAccountName: cert-manager

  # Webhook container image. Empty by default -> reuse the main mydns image
  # (which now contains the webhook binary).
  image:
    repository: ""
    tag: ""
    pullPolicy: ""

  replicaCount: 1

  service:
    type: ClusterIP
    port: 443

  # Database credentials the webhook uses to insert/remove ACME challenge
  # TXT records into the mydns schema. The webhook reads these from a
  # Kubernetes Secret at runtime (secret-reader RBAC) referenced by the
  # ClusterIssuer dbSecretRef, so this chart only needs to ensure the Secret
  # exists in the release namespace when an existingSecret is not supplied.
  db:
    # Name of an existing Secret containing host, port, user, password,
    # database keys. If empty, the chart creates one from the values below.
    existingSecret: ""
    host: ""
    port: "3306"
    user: "mydns_webhook"
    password: ""
    database: "mydns"

  # Resource requests/limits for the webhook Deployment
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  # Liveness and readiness probe tuning
  livenessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5

  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3

  # Pod scheduling options
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Pod security context for the webhook
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000

  # Container security context for the webhook
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  # Optional: specify image pull secrets for the webhook Deployment
  imagePullSecrets: []

  # Pod annotations/labels
  podAnnotations: {}
  podLabels: {}
