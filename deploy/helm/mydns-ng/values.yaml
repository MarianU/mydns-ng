# MyDNS-NG Helm Chart Values
# See README.md for full documentation

nameOverride: ""
fullnameOverride: ""

# Number of replicas
replicaCount: 3

image:
  # Combined mydns server + DNS-01 webhook image (private registry)
  repository: ghcr.io/marianu/mydns
  tag: ""  # Defaults to appVersion
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull-secret

# Server termination grace period (seconds)
terminationGracePeriodSeconds: 60

# Database configuration
database:
  # Use existing secret for database credentials.
  # Secret must contain keys: host, user, pass, database, domainCheck.
  # If empty, a Secret is created from the values below
  # (named <fullname>-secret).
  existingSecret: ""

  # Or specify credentials directly (not recommended for production)
  host: ""
  user: ""
  pass: ""
  name: "mydns"
  domainCheck: ""

# DNS server configuration
dns:
  # EDNS0 support
  edns:
    enabled: true
    maxUdpSize: 4096

  # Cache settings
  cache:
    zoneSize: 1024
    zoneExpire: 60
    replySize: 1024
    replyExpire: 30
    staleTtl: 300

# Response Rate Limiting (DDoS protection)
rrl:
  enabled: true
  rate: 20
  window: 15
  slipRatio: 2
  ipv4Prefix: 24
  ipv6Prefix: 48

# Logging configuration
logging:
  format: json  # text or json
  level: notice  # debug, info, notice, warning, error
  queryLog: false

# Metrics and health endpoints
metrics:
  enabled: false
  port: 9153

  # Prometheus ServiceMonitor
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

# Graceful shutdown
shutdown:
  timeout: 30

# Service configuration
service:
  type: NodePort
  annotations: {}

  dns:
    port: 53

  # For NodePort: UDP/TCP node ports
  nodePort:
    udp: "32053"
    tcp: "32053"

  # External traffic policy (Local recommended for source IP preservation)
  externalTrafficPolicy: Local

  # Session affinity for the DNS service
  sessionAffinity: ClientIP

# Kubernetes probes
probes:
  # "exec" (runs /app/bin/healthcheck.sh) or "httpGet" (metrics /readyz)
  readiness:
    type: exec
    execCommand: /app/bin/healthcheck.sh
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 1
    successThreshold: 1
    failureThreshold: 5
    httpGet:
      path: /readyz
      port: metrics

# Resource limits
resources:
  limits:
    cpu: 400m
    memory: 150Mi
  requests:
    cpu: 200m
    memory: 100Mi

# Security context (container-level)
securityContext:
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}

# Pod topology spread constraints
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: mydns-ng

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1

# Service account (for the server Deployment)
serviceAccount:
  create: false
  name: mydns-ng
  annotations: {}

# Extra environment variables
extraEnv: []
# - name: MYDNS_EXTRA_VAR
#   value: "value"

# Extra volume mounts
extraVolumeMounts: []

# Extra volumes
extraVolumes: []

# Pod annotations
podAnnotations: {}

# Pod labels
podLabels: {}

# Dynamic DNS sync cronjob (optional)
ddnsSync:
  enabled: true
  schedule: "*/15 * * * *"
  regions: 3
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  hostNetwork: true
  # Dedicated service account + RBAC so cron pods can read node status
  rbac:
    create: true
  # Zone-down detection: flips the `active` flag of region-mapped records
  # (rr join rr_zone) based on node Ready health so DNS fails over.
  zoneHealth:
    enabled: true

# DNS-01 ACME webhook (cert-manager solver) merged into this chart.
# When enabled, deploys the mydns-acme-webhook as a separate Deployment in
# the same release/namespace, using the same combined image (the webhook
# binary is baked into the mydns image).
dns01:
  enabled: false

  # API group the webhook serves (must match the webhook ClusterIssuer
  # solver groupName and be unique cluster-wide as an APIService)
  groupName: dns01.mydns-ng
  solverName: mydns

  # The webhook binary path inside the combined image
  binaryPath: /usr/local/bin/webhook

  # Register the K8s APIService (v1alpha1.<groupName>). Disable when you
  # register the APIService yourself (e.g. in an Argo meta chart).
  registerAPIService: true

  # cert-manager service account that must be granted domain-solver access
  certManager:
    namespace: ingress
    serviceAccountName: cert-manager

  # Webhook container image. Empty by default -> reuse the main mydns image
  # (which now contains the webhook binary).
  image:
    repository: ""
    tag: ""
    pullPolicy: ""

  replicaCount: 1

  service:
    type: ClusterIP
    port: 443

  # Database credentials the webhook uses to insert/remove ACME challenge
  # TXT records into the mydns schema. The webhook reads these from a
  # Kubernetes Secret at runtime (secret-reader RBAC) referenced by the
  # ClusterIssuer dbSecretRef, so this chart only needs to ensure the Secret
  # exists in the release namespace when an existingSecret is not supplied.
  db:
    # Name of an existing Secret containing host, port, user, password,
    # database keys. If empty, the chart creates one from the values below.
    existingSecret: ""
    host: ""
    port: "3306"
    user: "mydns_webhook"
    password: ""
    database: "mydns"

    # OPTIONAL - provision the webhook DB credentials dynamically via
    # OpenBao/Crossplane (write side) + VaultSecretsOperator (read side)
    # instead of a statically-rendered Secret.
    #
    # When enabled, this chart renders:
    #   write side (Crossplane / provider-vault):
    #     - SecretBackendRole: creates a NEW DB role on the OpenBao mount that
    #       binds to an EXISTING database-engine connection
    #       (crossplane.connection).
    #       The chart NEVER creates a connection (that needs DB admin/root
    #       credentials and is cluster-specific), it only binds to one the
    #       operator already configured on the mount.
    #     - Policy + AuthBackendRole: the OpenBao policy + kubernetes-auth role
    #       the VSO service account uses to read the dynamic credentials.
    #   read side (VSO):
    #     - VaultAuth + VaultDynamicSecret: syncs a short-lived
    #       username/password
    #       into a Secret named `mydns-ng.webhookDbSecret` with the flat
    #       host/port/user/password/database keys the webhook requires.
    #
    # When disabled (default), no Crossplane or VSO resource is rendered and
    # mydns deploys normally using the static Secret above / existingSecret,
    # so clusters without the crossplane provider or VSO are unaffected.
    vault:
      enabled: false
      # provider-vault ProviderConfig / OpenBao mount + existing connection
      crossplane:
        # ProviderConfig (vault.upbound.io) the managed resources reference.
        providerConfigRef: openbao
        # OpenBao database-engine mount path (e.g. "mariadb", "database").
        mount: mariadb
        # Name of the NEW DB role to create on the mount for the webhook. The
        # VaultDynamicSecret reads creds/<role>.
        role: mydns-webhook
        # Name of the EXISTING database-engine CONNECTION the role binds to
        # (its dbName). REQUIRED (must be non-empty) when vault is enabled.
        # This is not auto-created; it must already exist on `mount` (created
        # out-of-band). Do not set it to the role name unless such a
        # connection already exists.
        connection: "galera"
        defaultTtl: 3600
        maxTtl: 86400
        # SQL run by OpenBao when creating the dynamic user. Placeholders
        # {{name}}/{{password}} are OpenBao-generated values.
        creationStatements:
          - "CREATE USER '{{name}}'@'%' IDENTIFIED BY '{{password}}';"
          - "GRANT SELECT ON `mydns`.`soa` TO '{{name}}'@'%';"
          - "GRANT SELECT, INSERT, DELETE ON `mydns`.`rr` TO '{{name}}'@'%';"
          - "GRANT UPDATE (serial) ON `mydns`.`soa` TO '{{name}}'@'%';"
      # VSO read-side wiring (VaultDynamicSecret + VaultAuth)
      vso:
        vaultAuthRef: dns-openbao
        serviceAccount: default
        # OpenBao kubernetes auth role the VSO serviceAccount logs in with.
        # This is NOT the DB role name; it must be a kubernetes auth role that
        # exists on the vault kubernetes mount. Empty -> fall back to
        # crossplane.role (the pre-fix default).
        kubernetesRole: ""
        # Name of the OpenBao policy the kubernetes auth role is granted. The
        # provider-vault Policy managed resource is created with this name and
        # grants read on database/creds/<role>. Empty -> <role>-db.
        policy: ""
        tokenExpirationSeconds: 604800
        # how often VSO renews; 0.0 disables auto-restart
        renewalPercent: 67
        # DB host/port/database baked into the synced Secret (the address the
        # existing `connection` points at). Required when vault is enabled.
        host: "mariadb.database.svc"
        port: "3306"
        database: "mydns"

  # Resource requests/limits for the webhook Deployment
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  # Liveness and readiness probe tuning
  livenessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5

  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3

  # Pod scheduling options
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Pod security context for the webhook
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000

  # Container security context for the webhook
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  # Optional: specify image pull secrets for the webhook Deployment
  imagePullSecrets: []

  # Pod annotations/labels
  podAnnotations: {}
  podLabels: {}
