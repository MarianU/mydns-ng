# The GroupName here is used to identify your company or business unit that
# created this webhook.
# This name will need to be referenced in each Issuer's `webhook` stanza to
# inform cert-manager of where to send ChallengePayload resources.
# IMPORTANT: Change this to your own domain before deploying!
groupName: acme.example.com

# The solver name used in Issuer configuration
solverName: mydns

certManager:
  namespace: cert-manager
  serviceAccountName: cert-manager

image:
  repository: ghcr.io/mydns-ng/mydns-acme-webhook
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

service:
  type: ClusterIP
  port: 443

# Resource requests and limits
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# Liveness and readiness probe configuration
livenessProbe:
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3

# Pod scheduling options
nodeSelector: {}

tolerations: []

affinity: {}

# Security context for the pod
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# Security context for the container
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Optional: specify image pull secrets
imagePullSecrets: []

# Service account configuration
serviceAccount:
  # Annotations to add to the service account
  annotations: {}

# Pod annotations
podAnnotations: {}

# Pod labels
podLabels: {}
